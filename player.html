<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery Layout</title>

    <link rel="stylesheet" href="stylesheet/player.css">


    <!-- header-navbar link -->
    <link rel="stylesheet" href="stylesheet/style.css">

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="top-header">

            <!-- Logo -->
            <div class="logo">
                <img src="Assets/Logo & Jersy/Logo 2 ALT.png" alt="Website Logo">
            </div>

            <h1>
                Dersingham Dynamo
            </h1>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" placeholder="Search...">
            </div>

            <!-- Basket Icon -->
            <div class="basket-icon">
                <i class="fa-solid fa-basket-shopping"></i>
            </div>

            <!-- Login & Signup -->
            <div class="auth-buttons">
                <button>Login</button>
                <button>Signup</button>
            </div>

        </div>

        <!-- Navigation -->
        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="shop.html">Shop</a></li>

                <li><a href="event.html">Events</a></li>

                <li><a href="teamovr.html">Team overview</a></li>

                <li><a href="about.html">About</a></li>
            </ul>

        </nav>

    </header>

    <!-- ================= TOP VIDEO SECTION ================= -->

    <section class="top-videos">

        <!-- LEFT VIDEO -->

        <div class="video-box">

            <video controls>

                <source src="https://www.youtube.com/watch?v=rOzXTty4bMw" type="video-box">

            </video>

        </div>

        <!-- RIGHT VIDEO -->

        <div class="video-box">

            <video controls>

                <source src="videos/video2.mp4" type="video/mp4">

            </video>

        </div>

    </section>

    <!-- ================= TEXT BAR ================= -->

    <section class="text-bar">

        <div class="long-text-box">
            <p>Text</p>
        </div>

        <div class="small-text-box">
            <p>Text</p>
        </div>

    </section>

    <!-- ================= SOCIAL ICONS ================= -->

    <section class="top-socials">

        <i class="fa-brands fa-twitch"></i>

        <i class="fa-brands fa-youtube"></i>

        <i class="fa-brands fa-instagram"></i>

        <i class="fa-brands fa-twitter"></i>

    </section>

    <!-- ================= IMAGE CARDS ================= -->

    <section class="image-gallery">

        <!-- CARD 1 -->

        <div class="gallery-card">

            <img src="images/image1.jpg" alt="Gallery Image">

            <div class="bottom-text"></div>

            <div class="card-socials">

                <i class="fa-brands fa-twitch"></i>

                <i class="fa-brands fa-youtube"></i>

                <i class="fa-brands fa-instagram"></i>

                <i class="fa-brands fa-twitter"></i>

            </div>

        </div>

        <!-- CARD 2 -->

        <div class="gallery-card">

            <img src="images/image2.jpg" alt="Gallery Image">

            <div class="bottom-text"></div>

            <div class="card-socials">

                <i class="fa-brands fa-twitch"></i>

                <i class="fa-brands fa-youtube"></i>

                <i class="fa-brands fa-instagram"></i>

                <i class="fa-brands fa-twitter"></i>

            </div>

        </div>

        <!-- CARD 3 -->

        <div class="gallery-card">

            <img src="images/image3.jpg" alt="Gallery Image">

            <div class="bottom-text"></div>

            <div class="card-socials">

                <i class="fa-brands fa-twitch"></i>

                <i class="fa-brands fa-youtube"></i>

                <i class="fa-brands fa-instagram"></i>

                <i class="fa-brands fa-twitter"></i>

            </div>

        </div>

        <!-- CARD 4 -->

        <div class="gallery-card">

            <img src="images/image4.jpg" alt="Gallery Image">

            <div class="bottom-text"></div>

            <div class="card-socials">

                <i class="fa-brands fa-twitch"></i>

                <i class="fa-brands fa-youtube"></i>

                <i class="fa-brands fa-instagram"></i>

                <i class="fa-brands fa-twitter"></i>

            </div>

        </div>

    </section>

    <footer>
        <br><br>
        <p>
            © 2026 All Rights Reserved.
            Terms & Policies
            Cookie Preferences
        </p>
        <br><br><br>
    </footer>
</body>
</html>
